<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AR Golf Sandbox</title>
    <link rel="icon" href="data:,">

    <script>
        (function () {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'style.css?v=' + Date.now();
            document.head.appendChild(link);
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <body>

        <div id="cloudSkyLayer"></div>

        <div id="windContainer">
            <div id="windArrow">↑</div>
            <div id="windText">0 mph</div>
        </div>

        <button id="overheadBtn">Overhead View</button>

        <button id="backspinBtn" class="hidden">BACKSPIN OFF</button>

        <div id="scoreContainer">
            <div style="font-size: 18px; margin-bottom: 5px; color: #ffffff; font-weight: bold;">Score: <span
                    id="scoreToParText">E</span></div>

            <div style="color: #ffffff;">Strokes: <span id="strokeText" style="color: #dfa111;">0</span></div>

            <div id="distanceLine" style="font-size: 18px; margin-top: 5px; color: #ffffff; font-weight: bold;">
                Distance: <span id="distanceText" style="color: #dfa111;">---</span> <span id="unitText"
                    style="color: #dfa111;">yards</span>
            </div>
            <div id="clubOptionsContainer" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
            </div>
        </div>

        <div id="holeMapContainer">
            <div id="holeMapTitle">HOLE 1</div>
            <div id="holeMapPar">PAR 3</div>
        </div>

        <div id="distanceGauge" class="hidden">
            <div id="gaugeFill"></div>
            <div id="gaugeLabel">0 yds</div>
        </div>


        <div id="clubContainer">
            <div id="clubSwipe"></div>
        </div>

        <div id="scorecardOverlay">

            <div id="scorecardPlacard">
                <h2>COURSE SCORECARD</h2>
                <div class="table-responsive">
                    <table id="scorecardTable"></table>
                </div>
                <button id="nextHoleBtn"
                    style="margin-top: 15px; background: #ffcc66; color: #3d2b22; border: none; padding: 12px 24px; font-family: 'Georgia', serif; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">Continue
                    to Next Hole</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <script type="module" src="src/main.js"></script>
    </body>

</html>
