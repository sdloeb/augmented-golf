<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Golf Sandbox</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <div id="windContainer">
        <div id="windArrow">↑</div>
        <div id="windText">0 mph</div>
    </div>

   <div id="scoreContainer">
        <div>Strokes: <span id="strokeText">0</span></div>
        <div style="font-size: 14px; margin-top: 4px; color: #aaa;">
            Distance: <span id="distanceText">---</span> <span id="unitText">yards</span>
        </div>
        <div style="font-size: 14px; margin-top: 4px; color: #00ffcc; font-weight: bold;">
            Club: <span id="clubText">---</span>
        </div>
        <div id="clubOptionsContainer" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;"></div>
    </div>

    <div id="distanceGauge" class="hidden">
        <div id="gaugeFill"></div>
        <div id="gaugeLabel">0 yds</div>
    </div>

    <div id="clubSwipe"></div>

    <canvas id="gameCanvas"></canvas>

    <script type="module" src="src/main.js"></script>
</body>

</html>
