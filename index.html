<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AR Golf Sandbox</title>

    <script>
        (function () {
            var currentTime = Date.now();

            // 1. Inject the fresh CSS file path
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'style.css?v=' + currentTime;
            document.head.appendChild(link);

            // 2. Create a visual indicator once the screen finishes loading
            window.addEventListener('DOMContentLoaded', function () {
                var debugDiv = document.createElement('div');
                debugDiv.id = "cacheDebugIndicator";

                // Formats the timestamp into a readable text string (e.g., "Build: 12:34:56 PM")
                var timeString = new Date(currentTime).toLocaleTimeString();
                debugDiv.innerText = "Build: " + timeString;

                document.body.appendChild(debugDiv);
            });
        })();
    </script>

<body>

    <div id="windContainer">
        <div id="windArrow">↑</div>
        <div id="windText">0 mph</div>
    </div>

    <button id="overheadBtn">Overhead View</button>

    <div id="scoreContainer">
        <div>Strokes: <span id="strokeText">0</span></div>
        <div style="font-size: 14px; margin-top: 4px; color: #aaa;">
            Distance: <span id="distanceText">---</span> <span id="unitText">yards</span>
        </div>
        <div style="font-size: 14px; margin-top: 4px; color: #00ffcc; font-weight: bold;">
            Club: <span id="clubText">---</span>
        </div>
        <div id="clubOptionsContainer" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;"></div>
    </div>

    <div id="holeMapContainer">
        <div id="holeMapTitle">HOLE 1</div>
        <div id="holeMapPar">PAR 4</div>
    </div>

    <div id="distanceGauge" class="hidden">
        <div id="gaugeFill"></div>
        <div id="gaugeLabel">0 yds</div>
    </div>

    <div id="clubContainer">
        <div id="clubSwipe"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module" src="src/main.js"></script>
</body>

</html>
